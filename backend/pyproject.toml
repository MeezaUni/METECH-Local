[project]
name = "kmrl-hub-local"
version = "2.0.0"
description = "KMRL Sentient Operations Hub - AI-driven train induction planning (fully local AI edition)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "ortools>=9.10",
    "python-dotenv>=1.0",
    "torch>=2.7",
    "transformers>=4.51",
    "safetensors>=0.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Only needed to (re)train the model: uv sync --group train
train = ["peft>=0.15", "accelerate>=1.6"]

[tool.uv]
package = false

# CUDA build of PyTorch for NVIDIA GPUs (falls back to CPU at runtime if no GPU is present).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
